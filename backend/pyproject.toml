[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-signal-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "pydantic>=2.0,<3", "pandas>=2.2,<4",
  "numpy>=1.26,<3", "akshare==1.20.65"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["alembic*", "tests*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
