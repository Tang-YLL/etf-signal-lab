name: Market source probe (non-blocking)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/market-source-probe.yml'
      - 'scripts/probe_market_data.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
        working-directory: backend
      - run: python scripts/probe_market_data.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-source-probe
          path: data-source-probe.json
          if-no-files-found: warn
